<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bai4</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #1a1a1a;
            color: white;
            font-family: "Lora", serif;
            font-size: 20px;
            font-weight: 700;
        }

        .thanh-menu {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.4vw;
            padding: 0.01vw 0.1vw;
        }

        .nhan-hieu,
        .menu,
        .nut {
            height: 0.8vw;
            background: #272b2e;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 10px;
        }

        .nhan-hieu {
            width: 3.5vw;
        }

        .menu {
            width: 14vw;
        }

        .nut {
            width: 2vw;
            padding: 0;
            border: 0;
        }

        .gioi-thieu {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.7vw;
            padding: 2vw;
            background: #1f2324;
        }

        .noi-dung,
        .hinh-anh {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #272b2e;
            padding: 0.6vw;
        }

        .noi-dung {
            width: 10vw;
            height: 4.5vw;
        }

        .hinh-anh {
            width: 10vw;
            height: 9vw;
        }

        .phan,
        .vung-hai {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6vw;
            padding: 1.2vw;
        }

        .phan {
            width: 100%;
        }

        .vung-hai {
            width: 100%;
            background: #1f2324;
        }

        .tieu-de {
            width: 10vw;
            background: #272b2e;
            padding: 0.6vw;
            text-align: center;
        }

        .danh-sach {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5vw;
            width: 21vw;
        }

        .mon {
            height: 7vw;
            background: #272b2e;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ba-mon .mon {
            width: 30%;
        }

        .nam-mon .mon {
            width: 18%;
            height: 300px;
        }

        .bon-mon .mon {
            width: 22%;
        }

        footer {
            background: #272b2e;
            text-align: center;
            padding: 1.2vw;
        }
    </style>
</head>
<body>
    <div class="thanh-menu">
        <div class="nhan-hieu">Logo</div>
        <div class="menu">Menu</div>
        <button class="nut">Button</button>
    </div>
    <div class="gioi-thieu">
        <div class="noi-dung">Content</div>
        <div class="hinh-anh">Image</div>
    </div>
    <div class="phan">
        <div class="tieu-de">Title</div>
        <div class="danh-sach ba-mon">
            <div class="mon">Item</div>
            <div class="mon">Item</div>
            <div class="mon">Item</div>
            <div class="mon">Item</div>
            <div class="mon">Item</div>
            <div class="mon">Item</div>
        </div>
    </div>
    <div class="vung-hai">
        <div class="tieu-de">Title</div>
        <div class="danh-sach nam-mon">
            <div class="mon">Item</div>
            <div class="mon">Item</div>
            <div class="mon">Item</div>
            <div class="mon">Item</div>
            <div class="mon">Item</div>
        </div>
    </div>
    <div class="phan">
        <div class="tieu-de">Title</div>
        <div class="danh-sach bon-mon">
            <div class="mon">Item</div>
            <div class="mon">Item</div>
            <div class="mon">Item</div>
            <div class="mon">Item</div>
        </div>
    </div>
    <footer>
        <div>Footer</div>
    </footer>    
</body>
</html>
